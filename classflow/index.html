<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17211b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ClassFlow" />
  <title>ClassFlow · AI 实时课堂翻译</title>
  <meta name="description" content="英语/俄语课堂实时语音识别、中文翻译、云端记录和 AI 课堂笔记" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="auth-gate" id="authGate" hidden>
    <section class="auth-card">
      <div class="brand-mark large">C</div>
      <p class="eyebrow">CLASSFLOW CLOUD</p>
      <h1>登录后开始上课</h1>
      <p class="auth-copy">使用和“食光”相同的 Supabase 账号即可。课堂记录只保存在你的账号下。</p>
      <form id="authForm">
        <label>邮箱<input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com" /></label>
        <label>密码<input id="authPassword" type="password" autocomplete="current-password" required minlength="6" placeholder="至少 6 位" /></label>
        <button class="primary wide" id="loginButton" type="submit">登录</button>
        <button class="secondary wide" id="signupButton" type="button">注册账号</button>
      </form>
      <p class="auth-message" id="authMessage"></p>
    </section>
  </div>

  <main class="app-shell" id="appShell" hidden>
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">C</div>
        <div><div class="brand">ClassFlow</div><div class="subtitle">AI Classroom Translator · Cloud</div></div>
      </div>
      <div class="top-actions">
        <span class="sync-pill" id="syncPill">☁ 已连接</span>
        <span class="live-pill" id="livePill"><span class="dot"></span><span id="liveText">READY</span></span>
        <button class="ghost compact" id="historyButton">历史</button>
        <button class="ghost compact" id="accountButton">账号</button>
      </div>
    </header>

    <aside class="history-drawer" id="historyDrawer" aria-hidden="true">
      <div class="drawer-head"><div><span class="eyebrow">CLOUD HISTORY</span><h2>课堂历史</h2></div><button class="icon-button" id="closeHistory">×</button></div>
      <div class="history-list" id="historyList"></div>
    </aside>
    <div class="drawer-mask" id="drawerMask" hidden></div>

    <section class="hero-panel">
      <div class="hero-main">
        <label class="eyebrow">CURRENT CLASS</label>
        <input class="class-title" id="classTitle" value="Mechatronics" aria-label="课程名称" />
        <div class="status-line"><span id="status">正在连接云端…</span> · <span id="recordCount">0 条记录</span></div>
      </div>
      <div class="settings-row">
        <label>老师语言
          <select id="sourceLanguage">
            <option value="en-US">English</option>
            <option value="ru-RU">Русский</option>
            <option value="zh-CN">中文</option>
          </select>
        </label>
        <label>翻译为<select disabled><option>简体中文</option></select></label>
        <button class="new-class" id="newSession">＋ 新建课堂</button>
      </div>
    </section>

    <section class="notice" id="aiNotice" hidden>
      <strong>AI 翻译后端待配置</strong><span>课堂语音仍会实时识别并云端保存；配置 OpenAI API Key 后会自动开启翻译和 AI 笔记。</span>
    </section>

    <section class="workspace">
      <section class="column">
        <div class="column-head"><div><span class="head-kicker">01</span><h2>Original</h2></div><span>原始字幕</span></div>
        <div class="stream" id="originalStream"></div>
      </section>
      <section class="column">
        <div class="column-head"><div><span class="head-kicker">02</span><h2>Translation</h2></div><span>中文翻译</span></div>
        <div class="stream" id="translationStream"></div>
      </section>
      <section class="column notes-column">
        <div class="column-head"><div><span class="head-kicker">03</span><h2>Notes</h2></div><span>AI 课堂笔记</span></div>
        <div class="notes-area" id="notesArea"></div>
        <button class="notes-button" id="generateNotes">生成 AI 课堂笔记</button>
      </section>
    </section>

    <footer class="control-dock">
      <div class="quick-flags" id="quickFlags">
        <button data-flag="重点">★ 重点</button><button data-flag="考试">✓ 考试</button><button data-flag="没听懂">? 没听懂</button><button data-flag="例子">◇ 例子</button>
      </div>
      <button class="record-button" id="recordButton"><span class="record-icon">●</span><span id="recordLabel">开始听课</span></button>
      <div class="exports"><button id="exportMd">Markdown</button><button id="exportWord">Word</button></div>
    </footer>

    <div class="account-popover" id="accountPopover" hidden>
      <strong id="accountEmail">—</strong>
      <span>课堂记录已启用云同步</span>
      <button id="logoutButton">退出登录</button>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
