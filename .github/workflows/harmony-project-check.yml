name: Eating Time HarmonyOS Project Check

on:
  push:
    branches: [main]
    paths:
      - 'harmony/**'
      - '.github/workflows/harmony-project-check.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  harmony-project-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required HarmonyOS project files
        run: |
          set -e
          files=(
            harmony/AppScope/app.json5
            harmony/AppScope/resources/base/media/layered_image.json
            harmony/AppScope/resources/base/media/icon_background.png
            harmony/AppScope/resources/base/media/icon_foreground.png
            harmony/build-profile.json5
            harmony/hvigorfile.ts
            harmony/hvigor/hvigor-config.json5
            harmony/oh-package.json5
            harmony/entry/build-profile.json5
            harmony/entry/hvigorfile.ts
            harmony/entry/oh-package.json5
            harmony/entry/src/main/module.json5
            harmony/entry/src/main/ets/entryability/EntryAbility.ets
            harmony/entry/src/main/ets/pages/Index.ets
            harmony/entry/src/main/resources/base/element/string.json
            harmony/entry/src/main/resources/base/element/color.json
            harmony/entry/src/main/resources/base/media/start_icon.png
            harmony/entry/src/main/resources/base/profile/main_pages.json
            harmony/README.md
          )
          for file in "${files[@]}"; do test -s "$file" || { echo "Missing $file"; exit 1; }; done
      - name: Verify Eating Time web shell safety settings
        run: |
          set -e
          grep -F 'https://fansfood.github.io/#home' harmony/entry/src/main/ets/pages/Index.ets
          grep -F '.domStorageAccess(true)' harmony/entry/src/main/ets/pages/Index.ets
          grep -F '.javaScriptAccess(true)' harmony/entry/src/main/ets/pages/Index.ets
          grep -F '.imageAccess(true)' harmony/entry/src/main/ets/pages/Index.ets
          grep -F '.onlineImageAccess(true)' harmony/entry/src/main/ets/pages/Index.ets
          grep -F '.fileAccess(true)' harmony/entry/src/main/ets/pages/Index.ets
          grep -F 'ohos.permission.INTERNET' harmony/entry/src/main/module.json5
          grep -F 'io.github.fansfood.eatingtime' harmony/AppScope/app.json5
          grep -F '$media:layered_image' harmony/AppScope/app.json5
          grep -F '$media:start_icon' harmony/entry/src/main/module.json5
      - name: Note signing/build boundary
        run: echo 'Project structure verified. Installable HAP compilation/signing requires a HarmonyOS SDK + developer signing environment.'
      - name: Signal HarmonyOS project readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE='HARMONY_PROJECT_OK v1.1.001'
          BODY="HarmonyOS project structure verified for $GITHUB_SHA: Stage model files, ArkWeb online shell, DOM Storage, JavaScript, image/file access, INTERNET permission and branded layered icon resources are present. This is a project-structure check, not a signed HAP build."
          EXISTING=$(gh issue list --state all --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
