name: Eating Time UI Regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/eating-time-http.log 2>&1 &
          echo $! > /tmp/eating-time-http.pid
          sleep 2
      - name: Run responsive UI regression
        run: npm run test:ui
      - name: Upload UI screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eating-time-ui-regression
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
      - name: Signal UI regression success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE='UI_REGRESSION_OK v1.1.000'
          EXISTING=$(gh issue list --state all --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY="Chromium UI regression passed on $(date -u +'%Y-%m-%d %H:%M UTC'): desktop routes, mobile bottom navigation, buddy route, and overflow checks at 375/390/430/768/1024/1280/1440/1920."
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
