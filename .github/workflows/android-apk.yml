name: Build Eating Time Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - 'www/**'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install JS dependencies
        run: npm install
      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Apply Eating Time app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/res/values/strings.xml')
          s=p.read_text()
          s=s.replace('<string name="app_name">食光</string>','<string name="app_name">食光</string>')
          s=s.replace('<string name="title_activity_main">食光</string>','<string name="title_activity_main">食光</string>')
          p.write_text(s)
          PY
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Eating-Time-v1.1.000.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eating-Time-v1.1.000-Android
          path: Eating-Time-v1.1.000.apk
          retention-days: 30
