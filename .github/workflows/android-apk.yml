name: Build Eating Time Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'config.js'
      - 'manifest.webmanifest'
      - 'ui-v11000.js'
      - 'ui-v11000.css'
      - 'buddy-entry-v11001.js'
      - 'buddy-entry-v11001.css'
      - 'app.js'
      - 'account-v2.js'
      - 'groups.js'
      - 'tomorrow.js'
      - 'food-buddy-*.js'
      - 'food-buddy-*.css'
      - 'group-*.js'
      - 'group-*.css'
      - 'shopping-*.js'
      - 'shopping-*.css'
      - 'purchase-to-pantry-v11000.js'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'www/**'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
  issues: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install JS dependencies
        run: npm install
      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Generate Eating Time Android assets
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#FFF9F2' --iconBackgroundColorDark '#FFF9F2' --splashBackgroundColor '#FFF9F2' --splashBackgroundColorDark '#FFF9F2'
      - name: Verify Android package and app label
        run: |
          grep -R 'io.github.fansfood.eatingtime' android/app/build.gradle android/app/src/main/AndroidManifest.xml || true
          cat android/app/src/main/res/values/strings.xml
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Eating-Time-v1.1.001.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eating-Time-v1.1.001-Android
          path: Eating-Time-v1.1.001.apk
          retention-days: 30
      - name: Publish APK prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eating-time-v1.1.001-android
          target_commitish: main
          name: 食光 Eating Time v1.1.001 Android
          body: |
            食光 Eating Time v1.1.001 Android 测试安装包。

            - 使用正式 https://fansfood.github.io 作为应用内容源
            - 首页恢复“饭搭子”快捷入口
            - 手机快捷菜单恢复“打开饭搭子”入口
            - 保留 Supabase 登录、群组、饭搭子、投票、采购、冰箱与云端数据
            - 使用食光暖橙餐盘时钟图标
            - Debug APK，可直接在 Android 设备侧载测试
          prerelease: true
          files: Eating-Time-v1.1.001.apk
      - name: Signal APK ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE='APK_READY v1.1.001'
          URL='https://github.com/fansfood/fansfood.github.io/releases/download/eating-time-v1.1.001-android/Eating-Time-v1.1.001.apk'
          EXISTING=$(gh issue list --state all --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "APK build succeeded: $URL"
          else
            gh issue create --title "$TITLE" --body "APK build succeeded. Download: $URL"
          fi
